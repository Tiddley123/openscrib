[package]
name = "openscrib-app"
description = "OpenSCRIB step editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openscrib_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
openscrib-capture = { path = "../../crates/openscrib-capture" }
openscrib-core = { path = "../../crates/openscrib-core" }
openscrib-export = { path = "../../crates/openscrib-export" }
openscrib-process = { version = "0.1.0", path = "../../crates/openscrib-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
