[package]
name = "openscrib-cli"
description = "OpenSCRIB command-line recorder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
matroska-demuxer = "0.8.1"
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
openscrib-capture = { version = "0.1.0", path = "../openscrib-capture" }
openscrib-core = { version = "0.1.0", path = "../openscrib-core" }
openscrib-export = { version = "0.1.0", path = "../openscrib-export" }
openscrib-process = { version = "0.1.0", path = "../openscrib-process" }
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "openscrib"
path = "src/main.rs"
