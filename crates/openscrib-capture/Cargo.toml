[package]
name = "openscrib-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
image = "0.25.10"
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
openscrib-core = { version = "0.1.0", path = "../openscrib-core" }
opus = "0.4.0"
rdev = "0.5.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1.44"
ureq = "3.5.1"
xcap = "0.9.8"

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = "0.25.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile = "3.27.0"
