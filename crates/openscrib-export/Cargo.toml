[package]
name = "openscrib-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
matroska-demuxer = "0.8.1"
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
openscrib-core = { version = "0.1.0", path = "../openscrib-core" }
opus = "0.4.0"
pulldown-cmark = "0.13.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"

[dev-dependencies]
tempfile = "3.27.0"
